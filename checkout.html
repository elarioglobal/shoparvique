<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | ARVIQUE</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="assets/store.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"></head><body><header><div class="store-shell"><nav style="min-height:90px;display:flex;align-items:center;justify-content:space-between"><a href="shop.html"><img src="assets/arvique-header-logo.png" alt="ARVIQUE" style="width:250px;max-height:65px;object-fit:contain"></a><a href="cart.html">Back to cart</a></nav></div></header><main class="store-shell"><div class="store-head"><div><div class="eyebrow">CHECKOUT</div><h1 class="store-title">Complete your order.</h1><p class="store-sub">Your details are used only to process and support this order.</p></div></div><form id="form" class="checkout-grid"><section class="form-card" style="padding:24px"><div class="field"><label>Full name *</label><input name="name" required></div><div class="field"><label>Mobile number *</label><input name="phone" inputmode="tel" required></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Address *</label><textarea name="address" required></textarea></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label>City *</label><input name="city" required></div><div class="field"><label>PIN code *</label><input name="pincode" inputmode="numeric" required></div></div><div class="field"><label>State *</label><input name="state" required value="Punjab"></div><div class="field"><label>Payment</label><label class="payment-option"><input type="radio" name="payment" value="cod" checked> Cash on Delivery</label><label class="payment-option"><input type="radio" name="payment" value="upi"> UPI</label></div><div class="field"><label>Coupon code</label><div style="display:flex;gap:8px"><input name="coupon" id="coupon"><button type="button" class="store-btn" onclick="applyCoupon()">Apply</button></div><small id="couponMsg"></small></div><button class="store-btn primary" style="width:100%;min-height:54px;font-size:16px">Place Order</button><div id="msg" class="notice" hidden></div></section><aside class="summary"><h3>Order Summary</h3><div id="summary"></div></aside></form></main><script src="store-config.js"></script><script src="assets/store.js"></script><script>
const API=(window.ARVIQUE_CONFIG&&window.ARVIQUE_CONFIG.API)||'https://arvique-store-api.elarioglobal.workers.dev'; let discount=0, couponCode=''; function render(){const c=ARVIQUEStore.cart();if(!c.length){location.href='shop.html';return}const sub=ARVIQUEStore.total(c);const total=Math.max(0,sub-discount);document.getElementById('summary').innerHTML=c.map(i=>`<div class="summary-line"><span>${i.name} × ${i.qty}</span><strong>${ARVIQUEStore.money(i.price*i.qty)}</strong></div>`).join('')+`<div class="summary-line"><span>Subtotal</span><strong>${ARVIQUEStore.money(sub)}</strong></div><div class="summary-line"><span>Discount</span><strong>− ${ARVIQUEStore.money(discount)}</strong></div><div class="summary-total"><span>Total</span><strong>${ARVIQUEStore.money(total)}</strong></div>`} async function applyCoupon(){const code=document.getElementById('coupon').value.trim().toUpperCase();if(!code)return;try{const r=await fetch(API+'/api/coupon?code='+encodeURIComponent(code));const d=await r.json();if(!r.ok)throw new Error(d.error||'Invalid coupon');const sub=ARVIQUEStore.total(ARVIQUEStore.cart());discount=d.type==='percent'?Math.min(sub,Math.round(sub*d.value/100)):Math.min(sub,d.value);couponCode=code;document.getElementById('couponMsg').textContent='Coupon applied.';render()}catch(e){discount=0;couponCode='';document.getElementById('couponMsg').textContent=e.message;render()}}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.hidden=false;msg.textContent='Placing your order…';const fd=new FormData(e.target);const c=ARVIQUEStore.cart();const payload={customer:{name:fd.get('name'),phone:fd.get('phone'),email:fd.get('email'),address:fd.get('address'),city:fd.get('city'),state:fd.get('state'),pincode:fd.get('pincode')},payment:fd.get('payment'),coupon:couponCode,items:c.map(i=>({slug:i.slug,qty:i.qty})),client_total:Math.max(0,ARVIQUEStore.total(c)-discount)};try{const r=await fetch(API+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to place order');localStorage.removeItem('arvique_cart_v1');location.href='order-success.html?order='+encodeURIComponent(d.order_number)}catch(err){msg.textContent=err.message}});render();</script></body></html>
