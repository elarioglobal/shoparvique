<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart | ARVIQUE</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="assets/store.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"></head><body><header><div class="store-shell"><nav style="min-height:90px;display:flex;align-items:center;justify-content:space-between"><a href="shop.html"><img src="assets/arvique-header-logo.png" alt="ARVIQUE" style="width:250px;max-height:65px;object-fit:contain"></a><a href="shop.html">Continue Shopping</a></nav></div></header><main class="store-shell"><div class="store-head"><div><div class="eyebrow">YOUR CART</div><h1 class="store-title">Ready when you are.</h1></div></div><div class="checkout-grid"><div id="items"></div><aside class="summary"><h3>Order Summary</h3><div class="summary-line"><span>Subtotal</span><strong id="sub">₹0</strong></div><div class="summary-line"><span>Delivery</span><strong>Calculated at checkout</strong></div><div class="summary-total"><span>Total</span><strong id="tot">₹0</strong></div><a id="checkout" class="store-btn primary" style="width:100%;margin-top:18px" href="checkout.html">Proceed to Checkout</a></aside></div></main><script src="assets/store.js"></script><script>function render(){const c=ARVIQUEStore.cart(), box=document.getElementById('items');if(!c.length){box.innerHTML='<div class="form-card empty"><h3>Your cart is empty.</h3><p>Explore the ARVIQUE collection and add something you love.</p><a class="store-btn primary" href="shop.html" style="margin-top:18px">Shop ARVIQUE</a></div>';document.getElementById('checkout').style.display='none';return}box.innerHTML='<div class="cart-list">'+c.map(i=>`<div class="cart-row"><img src="${i.image}" alt=""><div><strong>${i.name}</strong><div style="margin-top:6px">${ARVIQUEStore.money(i.price)}</div><div class="qty" style="margin-top:10px"><button onclick="ARVIQUEStore.setQty('${i.slug}',${i.qty-1});render()">−</button><span>${i.qty}</span><button onclick="ARVIQUEStore.setQty('${i.slug}',${i.qty+1});render()">+</button><button class="store-btn" onclick="ARVIQUEStore.remove('${i.slug}');render()">Remove</button></div></div><strong class="row-total">${ARVIQUEStore.money(i.price*i.qty)}</strong></div>`).join('')+'</div>';document.getElementById('sub').textContent=ARVIQUEStore.money(ARVIQUEStore.total(c));document.getElementById('tot').textContent=ARVIQUEStore.money(ARVIQUEStore.total(c));}render();</script></body></html>
